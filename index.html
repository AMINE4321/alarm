<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP-Guard Pro Ultra</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-dark: #070a12;
      --card-bg: #0d1322;
      --card-border: #1e293b;
      --accent-blue: #3b82f6;
      --accent-cyan: #38bdf8;
      --danger-red: #ef4444;
      --success-green: #10b981;
      --warning-gold: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 15px; display: flex; justify-content: center; }

    /* التكيف الذكي مع نوع الجهاز */
    .app-container { width: 100%; max-width: 500px; margin: 0 auto; padding-bottom: 90px; transition: all 0.3s ease; }
    
    /* تصميم للشاشات الكبيرة: حاسوب وآيباد (Desktop & iPad) */
    @media (min-width: 768px) {
      .app-container { max-width: 1050px; padding-bottom: 20px; }
      .grid-layout { display: grid; grid-template-columns: 280px 1fr; gap: 20px; }
      .main-content { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
      .full-width { grid-column: span 2; }
      nav { position: relative !important; bottom: 0 !important; transform: none !important; left: 0 !important; width: 100% !important; margin-bottom: 20px; }
    }

    /* Header */
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; margin-bottom: 15px; }
    .brand { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
    .device-badge { background: rgba(59, 130, 246, 0.15); color: var(--accent-cyan); padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; border: 1px solid rgba(59, 130, 246, 0.3); }

    /* Login Overlay */
    #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(7, 10, 18, 0.9); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .login-card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 35px 25px; border-radius: 24px; text-align: center; width: 90%; max-width: 360px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }

    /* Cards */
    .card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 20px; border-radius: 20px; margin-bottom: 15px; box-shadow: 0 10px 25px -10px rgba(0,0,0,0.5); }
    .alarm-banner { padding: 18px; border-radius: 18px; text-align: center; font-weight: bold; font-size: 17px; margin-bottom: 15px; transition: all 0.3s; }
    .armed { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1.5px solid var(--danger-red); box-shadow: 0 0 20px rgba(239, 68, 68, 0.2); }
    .disarmed { background: rgba(16, 185, 129, 0.1); color: #34d399; border: 1.5px solid var(--success-green); box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); }

    /* Buttons */
    .grid-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 14px; font-weight: bold; cursor: pointer; color: white; font-size: 14px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn:active { transform: scale(0.97); }
    .btn-arm { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .btn-disarm { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-muted); }
    .btn-panic { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .btn-primary { background: linear-gradient(135deg, #3b82f6, #2563eb); }

    /* Log Box */
    .log-box { max-height: 140px; overflow-y: auto; font-size: 12px; color: var(--text-muted); }
    .log-item { padding: 6px 0; border-bottom: 1px solid #161f32; display: flex; justify-content: space-between; }

    /* Inputs */
    input[type=range], input[type=password], input[type=text] { width: 100%; padding: 12px; margin-top: 8px; background: var(--bg-dark); border: 1px solid var(--card-border); border-radius: 10px; color: #fff; outline: none; }

    /* Navigation Bar */
    nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: calc(100% - 30px); max-width: 470px; display: flex; background: rgba(13, 19, 34, 0.95); backdrop-filter: blur(16px); border: 1px solid var(--card-border); border-radius: 20px; padding: 6px; z-index: 100; }
    nav button { flex: 1; padding: 12px; border: none; background: transparent; color: var(--text-muted); font-size: 13px; font-weight: bold; cursor: pointer; border-radius: 14px; transition: 0.3s; }
    nav button.active { background: var(--accent-blue); color: white; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>

  <!-- شاشة الدخول -->
  <div id="loginOverlay">
    <div class="login-card">
      <i class="fa-solid fa-shield-halved fa-3x" style="color: var(--accent-blue); margin-bottom: 15px;"></i>
      <h3>ESP-Guard Pro</h3>
      <p style="color: var(--text-muted); font-size: 13px; margin-top: 5px;">أدخل رمز PIN المعتمد</p>
      <input type="password" id="loginPin" placeholder="****" style="text-align: center; font-size: 22px; letter-spacing: 5px;">
      <button class="btn btn-primary" style="margin-top: 18px;" onclick="checkLogin()">تسجيل الدخول</button>
      <p id="loginError" style="color: var(--danger-red); font-size: 12px; margin-top: 10px; display:none;">الرمز خاطئ!</p>
    </div>
  </div>

  <div class="app-container">
    <!-- الشريط العلوي مع الكشف عن نوع الجهاز -->
    <header>
      <div class="brand">
        <i class="fa-solid fa-microchip" style="color: var(--accent-cyan);"></i>
        ESP-Guard
      </div>
      <div class="device-badge" id="deviceType"><i class="fa-solid fa-desktop"></i> جاري التعرف...</div>
    </header>

    <div class="grid-layout">
      <!-- الشريط الجانبي للتنقل والاتصال -->
      <div>
        <div class="card" style="padding: 12px;">
          <div style="display: flex; gap: 8px;">
            <input type="text" id="espIp" placeholder="192.168.1.50" style="margin-top:0;">
            <button class="btn btn-primary" style="width: auto; padding: 0 15px;" onclick="saveIp()">ربط</button>
          </div>
        </div>

        <nav>
          <button class="active" onclick="switchTab('dashboard', this)"><i class="fa-solid fa-gauge"></i> الرئيسية</button>
          <button onclick="switchTab('sensors', this)"><i class="fa-solid fa-sliders"></i> الحساسات</button>
          <button onclick="switchTab('settings', this)"><i class="fa-solid fa-gear"></i> الإعدادات</button>
        </nav>
      </div>

      <!-- منطقة المحتوى الرئيسية -->
      <div class="main-content">
        <!-- الرئيسية TAB -->
        <div id="dashboard" class="tab-content active full-width">
          <div id="statusBanner" class="alarm-banner disarmed">
            <i class="fa-solid fa-spinner fa-spin"></i> جاري الاتصال...
          </div>

          <div class="grid-btns">
            <button class="btn btn-arm" onclick="sendCmd('/arm')"><i class="fa-solid fa-lock"></i> تفعيل (ARM)</button>
            <button class="btn btn-disarm" onclick="sendCmd('/disarm')"><i class="fa-solid fa-lock-open"></i> تعطيل (DISARM)</button>
          </div>

          <div class="card full-width">
            <h4 style="margin-bottom: 10px; font-size: 13px;"><i class="fa-solid fa-chart-line" style="color: var(--accent-blue);"></i> مخطط حركة المستشعر (A0)</h4>
            <canvas id="motionChart" height="110"></canvas>
          </div>

          <div class="card">
            <h4 style="margin-bottom: 10px;"><i class="fa-solid fa-circle-info"></i> حالة العتاد</h4>
            <div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #161f32;"><span>الباب (D5):</span><b id="doorVal">-</b></div>
            <div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #161f32;"><span>الحركة (A0):</span><b id="potVal">-</b></div>
            <div style="display: flex; justify-content: space-between; padding: 8px 0;"><span>الواي فاي:</span><b id="rssiVal">-</b></div>
          </div>

          <div class="card">
            <h4 style="margin-bottom: 10px;"><i class="fa-solid fa-list-check"></i> سجل الأحداث اللحظي</h4>
            <div class="log-box" id="logBox">
              <div class="log-item"><span>تم تشغيل النظام</span><span>الآن</span></div>
            </div>
          </div>
        </div>

        <!-- الحساسات TAB -->
        <div id="sensors" class="tab-content full-width">
          <div class="card">
            <h3><i class="fa-solid fa-sliders" style="color: var(--accent-blue);"></i> حساسية التنبيه (EEPROM)</h3>
            <br>
            <div style="display: flex; justify-content: space-between;">
              <span>الحد الحالي:</span>
              <b id="sliderText" style="color: var(--accent-cyan);">-</b>
            </div>
            <input type="range" id="threshRange" min="0" max="1023" onchange="sendCmd('/setThreshold?value=' + this.value)" oninput="document.getElementById('sliderText').innerText=this.value">
          </div>
        </div>

        <!-- الإعدادات TAB -->
        <div id="settings" class="tab-content full-width">
          <div class="card">
            <h3><i class="fa-solid fa-key" style="color: var(--accent-blue);"></i> رمز PIN</h3>
            <input type="password" id="pinInput" placeholder="رمز جديد">
            <button class="btn btn-primary" style="margin-top: 10px;" onclick="changePin()">تحديث الرمز</button>
          </div>

          <div class="card">
            <h3><i class="fa-solid fa-wifi" style="color: var(--accent-blue);"></i> إعدادات الواي فاي</h3>
            <input type="text" id="ssidInput" placeholder="اسم الشبكة">
            <input type="password" id="passInput" placeholder="كلمة المرور">
            <button class="btn btn-primary" style="margin-top: 10px; background: var(--warning-gold);" onclick="changeWifi()">إعادة التشغيل والحفظ</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    let getIp = () => localStorage.getItem('esp_ip') || '';
    let serverPin = "1234";
    let lastDoor = false, lastMotion = false;

    // 1. الكشف الذكي عن نوع الجهاز وشاشته
    function detectDevice() {
      const ua = navigator.userAgent;
      const width = window.innerWidth;
      const badge = document.getElementById('deviceType');

      if (/ipad|tablet/i.test(ua) || (width >= 768 && width <= 1024)) {
        badge.innerHTML = '<i class="fa-solid fa-tablet-screen-button"></i> جهاز آيباد / تابلت';
      } else if (/mobile/i.test(ua) || width < 768) {
        badge.innerHTML = '<i class="fa-solid fa-mobile-screen-button"></i> هاتف ذكي';
      } else {
        badge.innerHTML = '<i class="fa-solid fa-desktop"></i> حاسوب شخصي';
      }
    }

    // طلب إشعارات المتصفح
    if ("Notification" in window) { Notification.requestPermission(); }

    function pushNotification(title, body) {
      if (Notification.permission === "granted") {
        new Notification(title, { body: body, icon: 'https://cdn-icons-png.flaticon.com/512/1099/1099680.png' });
      }
    }

    function addLog(msg) {
      const box = document.getElementById('logBox');
      const time = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      box.innerHTML = `<div class="log-item"><span>${msg}</span><span>${time}</span></div>` + box.innerHTML;
    }

    // Chart Setup
    const ctx = document.getElementById('motionChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: Array(12).fill(''),
        datasets: [{ data: Array(12).fill(0), borderColor: '#3b82f6', borderWidth: 2, fill: true, backgroundColor: 'rgba(59, 130, 246, 0.1)', tension: 0.3 }]
      },
      options: { plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { min: 0, max: 1023 } } }
    });

    function checkLogin() {
      if(document.getElementById('loginPin').value === serverPin) {
        document.getElementById('loginOverlay').style.display = 'none';
        addLog('تم تسجيل الدخول بنجاح');
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    }

    function saveIp() {
      let ip = document.getElementById('espIp').value.trim();
      if(ip) { localStorage.setItem('esp_ip', ip); refreshData(); addLog('تم تحديث IP الجهاز'); }
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    function sendCmd(path) {
      let ip = getIp();
      if(!ip) return alert('أدخل IP أولاً');
      fetch(`http://${ip}${path}`).then(() => addLog(`أمر: ${path}`)).catch(e => console.error(e));
    }

    function changePin() {
      let p = document.getElementById('pinInput').value;
      if(p) { sendCmd('/setPin?value=' + encodeURIComponent(p)); alert('تم الحفظ!'); }
    }

    function changeWifi() {
      let s = document.getElementById('ssidInput').value, p = document.getElementById('passInput').value;
      if(s && p) { sendCmd(`/setWifi?ssid=${encodeURIComponent(s)}&pass=${encodeURIComponent(p)}`); }
    }

    function refreshData() {
      let ip = getIp();
      if(!ip) return;

      fetch(`http://${ip}/api/data`)
        .then(res => res.json())
        .then(data => {
          serverPin = data.pin;
          const sb = document.getElementById('statusBanner');
          
          if(data.armed) {
            sb.className = 'alarm-banner armed';
            sb.innerHTML = '<i class="fa-solid fa-shield-halved"></i> نظام الأمان: مُفعل (ARM)';
          } else {
            sb.className = 'alarm-banner disarmed';
            sb.innerHTML = '<i class="fa-solid fa-lock-open"></i> نظام الأمان: معطل (DISARM)';
          }

          // الإشعارات والسجل اللحظي
          if(data.armed) {
            if(data.door && !lastDoor) {
              pushNotification("⚠️ تنبيه أمني!", "تم فتح الباب فجأة!");
              addLog("⚠️ فتح الباب أثناء التفعيل!");
            }
            if(data.pot >= data.thresh && !lastMotion) {
              pushNotification("⚠️ تنبيه حركة!", "تم رصد حركة متجاوزة للحد!");
              addLog("⚠️ رصد حركة عالية!");
            }
          }
          lastDoor = data.door;
          lastMotion = (data.pot >= data.thresh);

          document.getElementById('doorVal').innerText = data.door ? "مفتوح 🚪" : "مغلق ✅";
          document.getElementById('potVal').innerText = data.pot;
          document.getElementById('rssiVal').innerText = `${data.quality}%`;
          document.getElementById('threshRange').value = data.thresh;
          document.getElementById('sliderText').innerText = data.thresh;

          chart.data.datasets[0].data.push(data.pot);
          chart.data.datasets[0].data.shift();
          chart.update();
        })
        .catch(() => {
          document.getElementById('statusBanner').className = 'alarm-banner armed';
          document.getElementById('statusBanner').innerText = 'غير متصل بالجهاز ❌';
        });
    }

    window.addEventListener('resize', detectDevice);
    detectDevice();

    if(getIp()) document.getElementById('espIp').value = getIp();
    setInterval(refreshData, 2000);
    refreshData();
  </script>
</body>
</html>
